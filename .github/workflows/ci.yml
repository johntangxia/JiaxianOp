name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支上有新的提交时，取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端：测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # vue-tsc 类型检查 + 生产构建

  backend-unit:
    name: 后端：单元测试（不需要基础设施，约半分钟）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # *IT 是连真实 OpenGauss/Redis/Kafka 的集成测试，在下一个任务里跑
      - run: mvn -B test '-Dtest=!*IT'

  backend-integration:
    name: 后端：集成测试（OpenGauss + Redis + Kafka，约 15–20 分钟）
    runs-on: ubuntu-latest
    needs: backend-unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: 拉起基础设施（docker compose，等健康检查通过）
        run: docker compose up -d --wait --wait-timeout 300
      - name: 跑集成测试（独立的测试库、Kafka 主题、消费组和 Redis 库）
        run: scripts/test-backend.sh -B
      - name: 失败时保留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
      - name: 清理
        if: always()
        run: docker compose down -v
