spring:
  application:
    name: jiaxian-analytics
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:jiaxian_app}
    password: ${DB_PASSWORD:Jiaxian@2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: jiaxian-analytics-realtime
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.jiaxian.analytics.realtime.RealtimeEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.jiaxian.analytics.realtime

realtime:
  consumer:
    auto-startup: true

server:
  port: 8080

analytics:
  kol:
    top-n: 1000
    window-days: 90
    recent-days: 30
    baseline-days: 90
    churn-drop-threshold: 0.5
    rebuild-cron: "0 0 1 * * MON"
    schedule:
      enabled: true
